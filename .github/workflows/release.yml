name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: pst2pdf

jobs:
  metadata:
    name: Derive release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_name: ${{ steps.release.outputs.release_name }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        id: release
        shell: bash
        run: |
          base_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            prerelease=false
          else
            version="${base_version}-snapshot.${GITHUB_RUN_NUMBER}.${GITHUB_SHA::7}"
            prerelease=true
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "release_name=pst2pdf ${version}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

  build-linux:
    name: Build Linux release
    needs: metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set release version
        shell: bash
        run: sed -i '0,/^version = ".*"/s//version = "${{ needs.metadata.outputs.version }}"/' Cargo.toml

      - name: Build binary
        run: cargo build --release

      - name: Package archive
        id: package
        shell: bash
        run: |
          dist="dist/linux"
          mkdir -p "${dist}"
          cp "target/release/${APP_NAME}" "${dist}/"
          archive="dist/${APP_NAME}-${{ needs.metadata.outputs.version }}-linux-x86_64.tar.gz"
          tar -C "${dist}" -czf "${archive}" "${APP_NAME}"
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: linux-archive
          path: ${{ steps.package.outputs.archive }}

  build-windows:
    name: Build Windows release
    needs: metadata
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set release version
        shell: bash
        run: sed -i '0,/^version = ".*"/s//version = "${{ needs.metadata.outputs.version }}"/' Cargo.toml

      - name: Build binary
        shell: pwsh
        run: cargo build --release

      - name: Package archive
        id: package
        shell: pwsh
        run: |
          $dist = "dist\windows"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "target\release\$env:APP_NAME.exe" $dist
          $archive = "dist\$env:APP_NAME-${{ needs.metadata.outputs.version }}-windows-x86_64.zip"
          Compress-Archive -Path "$dist\$env:APP_NAME.exe" -DestinationPath $archive -Force
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: windows-archive
          path: ${{ steps.package.outputs.archive }}

  sbom:
    name: Generate SBOM
    needs: metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set release version
        shell: bash
        run: sed -i '0,/^version = ".*"/s//version = "${{ needs.metadata.outputs.version }}"/' Cargo.toml

      - name: Install CycloneDX generator
        run: cargo install cargo-cyclonedx --locked

      - name: Generate SBOM
        shell: bash
        run: |
          mkdir -p dist
          cargo cyclonedx --format json --override-filename sbom
          mv sbom.json "dist/sbom-${{ needs.metadata.outputs.version }}.json"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/sbom-${{ needs.metadata.outputs.version }}.json

  provenance:
    name: Generate provenance
    needs: [metadata, build-linux, build-windows, sbom]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create provenance manifest
        shell: bash
        run: |
          python .github/scripts/provenance.py
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}

      - name: Upload provenance
        uses: actions/upload-artifact@v4
        with:
          name: provenance
          path: dist/provenance-${{ needs.metadata.outputs.version }}.json

  release:
    name: Publish release
    needs: [metadata, build-linux, build-windows, sbom, provenance]
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.release_tag }}
          name: ${{ needs.metadata.outputs.release_name }}
          prerelease: ${{ needs.metadata.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.metadata.outputs.prerelease != 'true' }}
          files: release-assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
